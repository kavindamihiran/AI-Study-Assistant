services:
  - type: web
    name: studyos-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_DEFAULT_MODEL_ID
        sync: false
      - key: ACTIVE_MODEL_PROFILE_ID
        value: study_ai_default
      - key: FRONTEND_URL
        fromService:
          type: web
          name: studyos-web
          property: host
      - key: DATA_DIR
        value: /tmp/studyos
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: VECTOR_STORE_PROVIDER
        value: local
      - key: EMBEDDING_PROVIDER
        value: local
      - key: EMBEDDING_DIMENSION
        value: "384"
      - key: LLM_REQUEST_TIMEOUT_SECONDS
        value: "90"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: none
      - key: AUTH_REGISTRATION_ENABLED
        value: "true"

  - type: web
    name: studyos-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    autoDeployTrigger: commit
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: studyos-api
          property: host
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
